services:
  underway:
    build: .
    image: underway:latest
    container_name: underway
    restart: unless-stopped
    ports:
      - "8931:8931"   # all interfaces: phones on your Wi-Fi reach http://<this-machine-ip>:8931; Caddy/cloudflared can front it too
    volumes:
      - underway-data:/data      # SQLite database: games, replays, admirals, leaderboard
    environment:
      - PORT=8931
volumes:
  underway-data:
