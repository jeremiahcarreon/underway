<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>UNDERWAY — naval combat where the fleets move</title>
<style>
/* ============================================================
   UNDERWAY — styles
   ============================================================ */
:root{
  --bg:#0b1520; --bg2:#0f1d2b; --panel:#132536; --panel2:#18304a; --line:#274460;
  --text:#dfe9f2; --muted:#8aa0b5; --accent:#ffb347; --accent2:#3fa9f5; --danger:#e0453b; --ok:#3ecf8e;
  --sea:#123c5c; --sea2:#0d2f4a; --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --cell:36px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100%;overflow-x:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;font-size:15px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px;line-height:1.1;touch-action:manipulation}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
button.primary{background:var(--accent);color:#1a1200;border-color:#e39b2c;font-weight:700}
button.danger{background:#5a1c18;border-color:#8c2a24}
button.small{min-height:34px;padding:6px 10px;font-size:13px}
button.icon{min-width:44px;padding:6px}
input[type=text]{font-family:inherit;font-size:16px;color:var(--text);background:#0a1621;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
input[type=range]{width:100%}
h1,h2,h3{margin:0 0 8px 0;font-weight:700;letter-spacing:.02em}
h1{font-size:34px;letter-spacing:.18em}
h2{font-size:20px}
h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.spacer{flex:1}
.hidden{display:none !important}
.screen{display:none;min-height:100vh;padding:12px}
.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.center{max-width:640px;margin:0 auto}
.brand{text-align:center;padding:24px 0 8px}
.brand h1{background:linear-gradient(180deg,#fff,#9fc4e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tag{color:var(--muted);font-size:14px;letter-spacing:.08em}
.logo{width:120px;height:120px;margin:0 auto;display:block}
.sub{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.navygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.navybtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;min-height:80px;position:relative}
.navybtn svg{width:64px;height:40px;border:1px solid #0006;border-radius:2px;box-shadow:0 1px 3px #0008}
.navybtn span{font-size:12px}
.navybtn.selected{outline:3px solid var(--accent);background:#2a3c1c}
.navybtn.locked{opacity:.35;cursor:not-allowed}
.navybtn.locked::after{content:"TAKEN";position:absolute;top:6px;right:6px;font-size:10px;background:var(--danger);padding:2px 5px;border-radius:4px;color:#fff}
.roomcode{font-family:var(--mono);font-size:26px;letter-spacing:.3em;font-weight:700;color:var(--accent)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.conn .dot{width:10px;height:10px;border-radius:50%;background:#666;box-shadow:0 0 6px #0000}
.conn.online .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.conn.reconnecting .dot{background:var(--accent);animation:blink 1s infinite}
.conn.offline .dot{background:var(--danger)}
@keyframes blink{50%{opacity:.2}}
.playerbox{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.playerbox svg{width:48px;height:30px;border-radius:2px}
.playerbox .pname{font-weight:700}
.playerbox .pnavy{font-size:12px;color:var(--muted)}

/* ---- oceans ---- */
.ocean{position:relative;width:100%;max-width:560px;margin:0 auto}
.ocean canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none;background:#0a2438}
.ocean .label{position:absolute;top:6px;left:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfe3f5;text-shadow:0 1px 2px #000;pointer-events:none;opacity:.9}
.ocean .badge{position:absolute;top:6px;right:10px;font-size:11px;letter-spacing:.1em;color:#fff;background:#0008;padding:2px 8px;border-radius:10px;pointer-events:none}

/* ---- fleet dock ---- */
.dock{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dockship{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);cursor:pointer;min-height:44px}
.dockship canvas{width:100px;height:34px;display:block}
.dockship.selected{outline:2px solid var(--accent)}
.dockship.disabled{opacity:.55;cursor:default}
.dockship .dname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dockship .dcls{font-size:11px;color:var(--muted)}
.dockship .secs{display:flex;gap:3px;margin-top:3px}
.dockship .sec{width:14px;height:10px;border-radius:2px;background:#3d5a75;border:1px solid #6a8aa8}
.dockship .sec.hit{background:#e0453b;border-color:#ff8a7a;box-shadow:0 0 4px #ff5a4a}
.dockship .sec.bow{border-radius:6px 2px 2px 6px}
.dockship .mob{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:#1d3b2a;color:#8ef0b8;white-space:nowrap}
.dockship .mob.damaged{background:#4a3a12;color:#ffd27a}
.dockship .mob.crippled{background:#4a1d1d;color:#ff9a90}
.dockship .mob.sunk{background:#2a2a2a;color:#999}
.dockship .mob.unplaced{background:#2b3948;color:#c6d6e6}
.dockship .mob.placed{background:#1d3b2a;color:#8ef0b8}

/* ---- battle layout ---- */
#screen-battle{padding:8px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.topbar .roomcode{font-size:16px;letter-spacing:.2em}
.topbar .turn{font-weight:700;font-size:14px;padding:4px 10px;background:var(--bg2);border-radius:6px}
.battle{display:grid;grid-template-columns:1fr 1fr 240px;gap:10px;align-items:start}
.battle .side{min-width:0}
.tabs{display:none;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
.tabs button.active{background:var(--accent);color:#1a1200;font-weight:700}
.tally{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.tally div{font-size:11px;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 2px}
.tally b{display:block;font-size:14px}
.tally .done{color:var(--ok)}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;height:520px;display:flex;flex-direction:column}
.logbox h3{margin-bottom:6px}
.log{flex:1;overflow-y:auto;font-size:12.5px;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.log div{padding:3px 6px;border-radius:5px;background:#0a1621}
.log .t{color:var(--muted);font-family:var(--mono);font-size:11px;margin-right:4px}
.log .me{border-left:3px solid var(--accent2)}
.log .them{border-left:3px solid var(--danger)}
.log .sys{border-left:3px solid var(--muted);color:var(--muted)}
.log .chat{font-style:italic;color:#c7d8e8}
.actions{position:sticky;bottom:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:8px;background:#0f1d2bee;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);z-index:5}
.actions select{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px;max-width:200px}
.actions .phase{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:100%}
.actions button.fire{background:var(--danger);border-color:#ff7a70;font-weight:800;letter-spacing:.1em;min-width:110px}
.actions button.fire:disabled{background:#3a2422}

/* ---- overlays ---- */
.overlay{position:fixed;inset:0;background:#050b12dd;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.active{display:flex}
.overlay .card{max-width:520px;width:100%;max-height:92vh;overflow:auto}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:40;opacity:0;transition:opacity .3s}
.banner.show{opacity:1}
.banner div{display:inline-block;padding:14px 28px;background:#0a1621ee;border:2px solid var(--accent);border-radius:14px;font-size:22px;font-weight:800;letter-spacing:.1em;box-shadow:0 8px 40px #000c}
.banner .radar{width:56px;height:56px;margin:0 auto 6px;display:block}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;display:flex;flex-direction:column;gap:6px;z-index:45;pointer-events:none;align-items:center;width:min(94vw,520px)}
.toast{background:#0a1621f0;border:1px solid var(--line);border-left:4px solid var(--accent);padding:8px 14px;border-radius:8px;font-size:14px;animation:toastin .25s ease-out;box-shadow:0 6px 24px #000a;max-width:100%}
.toast.hit{border-left-color:var(--danger)}
.toast.miss{border-left-color:#8ab}
.toast.sunk{border-left-color:#ff8c00;font-weight:700}
.toast.chat{border-left-color:var(--accent2);font-style:italic}
.toast.err{border-left-color:var(--danger);background:#3a1212f0}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.curtain{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1a3350,#050b12 70%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:60;text-align:center;padding:20px}
.curtain.active{display:flex}
.curtain h2{font-size:26px}
#peg-tip{position:fixed;pointer-events:none;background:#0a1621f5;border:1px solid var(--accent);padding:6px 10px;border-radius:6px;font-size:12.5px;z-index:70;display:none;max-width:240px;box-shadow:0 4px 18px #000c}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
.settings .field{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.settings .field label{text-transform:none;font-size:14px;color:var(--text);letter-spacing:0}
.settings input[type=range]{width:160px}
.switch{width:52px;height:30px;border-radius:15px;background:#334;border:1px solid var(--line);position:relative;cursor:pointer;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#bbb;transition:.15s}
.switch.on{background:var(--ok)}
.switch.on::after{left:25px;background:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.stats b{color:var(--accent)}
.resultcard{max-width:560px;margin:0 auto}
.resultcard h1{font-size:44px;text-align:center;margin:8px 0}
.resultcard h1.victory{color:var(--accent);text-shadow:0 0 30px #ffb34788}
.resultcard h1.defeat{color:#8aa0b5}
#cine{position:fixed;inset:0;z-index:55;display:none;background:#000}
#cine.active{display:block}
#cine canvas{width:100%;height:100%;display:block}
#cine .skip{position:absolute;right:14px;bottom:14px;z-index:2}
#cine .cap{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#fff;font-size:18px;letter-spacing:.1em;text-shadow:0 2px 8px #000;pointer-events:none}
.replay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.replaybar{display:flex;gap:8px;align-items:center;margin:10px 0}
.replaybar input[type=range]{flex:1}
.replayinfo{font-size:13px;min-height:40px;padding:6px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--line)}
table.tests{width:100%;border-collapse:collapse;font-size:13px}
table.tests td,table.tests th{border:1px solid var(--line);padding:5px 8px;text-align:left}
table.tests tr.pass td:first-child{color:var(--ok);font-weight:700}
table.tests tr.fail td:first-child{color:var(--danger);font-weight:700}
.coin{width:160px;height:160px;margin:10px auto;display:block}
.helpk{font-family:var(--mono);background:#0a1621;padding:1px 5px;border-radius:4px;font-size:12px}
.placetools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.placetools button{flex:1 1 auto}
.hint{font-size:13px;color:var(--muted);padding:6px 10px;background:var(--bg2);border-radius:8px;border:1px dashed var(--line);margin-top:8px;min-height:36px}
.err{color:#ff9a90;font-size:13px}
.livery{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0006;vertical-align:middle}
.footer{font-size:11px;color:var(--muted);text-align:center;padding:14px}
.footer a{color:var(--muted)}

@media (max-width: 1080px){
  .battle{grid-template-columns:1fr 1fr}
  .logbox{grid-column:1 / -1;height:200px}
}
@media (max-width: 720px){
  .screen{padding:8px}
  .battle{grid-template-columns:1fr}
  .tabs{display:flex}
  .battle .side.inactive{display:none}
  .logbox{height:160px}
  .ocean{max-width:100%}
  .actions{gap:5px}
  .actions button{padding:8px 10px;font-size:14px}
  .actions select{max-width:150px}
  h1{font-size:28px}
  .replay{grid-template-columns:1fr}
}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
